[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elecfr"
version = "0.1.0"
description = "Prévision J+1 de la consommation électrique française et simulation des prix day-ahead"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "holidays>=0.50",
  "entsoe-py>=0.6",
  "python-dotenv>=1.0",
  "mlflow>=2.12",
  "deltalake>=0.25",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "tabulate>=0.9",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# PyTorch, pour le LSTM seulement (lourd : optionnel, et absent de l'intégration continue)
lstm = ["torch>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
